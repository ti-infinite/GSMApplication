name: Deploy GSMFrontend

on:
  push:
    branches: ["develop", "quality", "main"]
    paths:
      - "gsmapplications-frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/qa/prod)'
        default: 'dev'

env:
  AWS_REGION: us-east-1

jobs:
  determine-env:
    if: ${{ vars.WORKFLOW_FRONTEND_ENABLED == 'true' }}
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              ENV="prod"
            elif [ "$BRANCH" = "quality" ]; then
              ENV="qa"
            elif [ "$BRANCH" = "develop" ]; then
              ENV="dev"
            else
              ENV="dev"
            fi
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying gsmapplication-$ENV-frontend"

  deploy:
    if: ${{ vars.WORKFLOW_FRONTEND_ENABLED == 'true' }}
    name: Deploy GSMFrontend
    needs: determine-env
    runs-on: ubuntu-latest
    environment: frontend-${{ needs.determine-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gsmapplications-frontend/package-lock.json

      - name: Install dependencies
        working-directory: gsmapplications-frontend
        run: npm ci

      - name: Build
        working-directory: gsmapplications-frontend
        env:
          VITE_TENANT_DEFAULT_EN: ${{ vars.TENANT_DEFAULT_EN }}
          VITE_TENANT_DEFAULT_ES: ${{ vars.TENANT_DEFAULT_ES }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        working-directory: gsmapplications-frontend
        run: |
          aws s3 sync ./dist/ s3://${{ vars.S3_BUCKET_NAME }}/admin/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
