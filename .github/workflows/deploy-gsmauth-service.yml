name: Deploy GSMAuth Service
on:
  push:
    branches: ["develop", "main","quality"]
    paths:
      - "gsmapplications-backend/microservices/gsmauth/**"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/qa/prod)'
        default: 'dev'

env:
  AWS_REGION: us-east-1

jobs:
  determine-env:
    if: ${{ vars.WORKFLOW_BACKEND_ENABLED == 'true' }}
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" = "main" ]; then
              ENV="prod"
            elif [ "$BRANCH" = "quality" ]; then
              ENV="qa"
            elif [ "$BRANCH" = "develop" ]; then
              ENV="dev"
            else
                ENV="dev"
            fi
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying gsmapplication-$ENV-stack"

  deploy:
    if: ${{ vars.WORKFLOW_BACKEND_ENABLED == 'true' }}
    name: Deploy Auth Service
    needs: determine-env
    runs-on: ubuntu-latest
    environment: backend-${{ needs.determine-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set up QEMU (emulación arm64)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build, tag, and push to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: gsmapplications-backend/microservices/gsmauth
        run: |
          echo "Building arm64 image: linux/arm64"
          
          # Build arm64 específico
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:auth-$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:auth-latest \
            --push \
            .
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:auth-latest" >> $GITHUB_OUTPUT
      
      - name: Get latest task definition and update image
        id: render
        env:
          TASK_FAMILY: ${{ needs.determine-env.outputs.environment }}-${{ vars.APP_NAME }}-auth-task
          CONTAINER_NAME: gsmauth
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query "taskDefinition" \
            > task-definition.json
          
          jq --arg IMAGE "$IMAGE_URI" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions |= map(
              if .name == $NAME then .image = $IMAGE else . end
            )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-definition.json > new-task-def.json
          
          new_def_arn=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          
          echo "task_definition_arn=$new_def_arn" >> $GITHUB_OUTPUT
      
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: new-task-def.json
          service: ${{ vars.AUTH_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true