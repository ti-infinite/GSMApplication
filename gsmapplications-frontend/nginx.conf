server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers — applied to all responses.
    # NOTE: location blocks below must NOT use add_header or these will be lost (nginx inheritance rule).
    add_header X-Frame-Options            "SAMEORIGIN"                                                                                                                                                                                                               always;
    add_header X-Content-Type-Options     "nosniff"                                                                                                                                                                                                                  always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                                                                                                                                                                                          always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()"                                                                                                                                                                                 always;
    add_header Cross-Origin-Opener-Policy "same-origin"                                                                                                                                                                                                              always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src *; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none"                                                                                                                                                                                                            always;

    # Hashed assets: cache 1 year via expires (does not break add_header inheritance)
    location ~* ^/assets/ {
        expires 1y;
        etag on;
    }

    location /api/ {
        proxy_pass         http://gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}